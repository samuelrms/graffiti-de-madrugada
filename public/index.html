<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graffiti de Madrugada</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #07060d; color: #e2e8f0; }
      canvas { display: block; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #top { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; align-items: flex-start; gap: 10px; }
      h1 { margin: 0; font-size: 20px; letter-spacing: 1px; text-shadow: 0 2px 8px #000; }
      h1 span { color: #ff2d75; text-shadow: 0 0 12px #ff2d75; }
      #timer { margin-left: auto; font-size: 30px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 8px #000; }
      #board { position: absolute; top: 48px; left: 10px; display: flex; flex-direction: column; gap: 4px; }
      .chip { display: flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: rgba(10, 8, 20, 0.75); border: 2px solid transparent; font-size: 13px; font-weight: 700; }
      .chip.me { border-color: #fff; }
      .chip i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; }
      .chip b { margin-left: auto; padding-left: 8px; }
      #name { position: absolute; top: 48px; right: 10px; pointer-events: auto; padding: 7px 10px; border-radius: 8px; border: 1px solid #334155; background: rgba(10, 8, 20, 0.8); color: #fff; width: 130px; }
      #cross { position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px; border: 2px solid #fff; border-radius: 50%; opacity: 0.8; }
      #cross.can { border-color: #b4ff39; box-shadow: 0 0 8px #b4ff39; }
      #hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #cbd5e1; background: rgba(10, 8, 20, 0.7); padding: 6px 12px; border-radius: 8px; white-space: nowrap; }
      kbd { background: #1e293b; padding: 1px 6px; border-radius: 4px; font-family: inherit; }
      #push { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); width: 120px; height: 5px; background: rgba(255,255,255,0.2); border-radius: 3px; overflow: hidden; }
      #push i { display: block; height: 100%; background: #ff2d75; width: 100%; }
      #overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(2, 6, 23, 0.45); pointer-events: auto; }
      #overlay.hidden { display: none; }
      #overlay h2 { margin: 0 0 8px; font-size: 36px; text-shadow: 0 2px 10px #000; }
      #overlay p { margin: 4px 0; color: #cbd5e1; }
      #overlay .big { font-size: 90px; font-weight: 900; line-height: 1; }
      button { margin-top: 12px; padding: 10px 22px; font-size: 16px; font-weight: 800; border: 0; border-radius: 10px; background: #ff2d75; color: #fff; cursor: pointer; box-shadow: 0 0 16px #ff2d75; }
      #stun { position: absolute; inset: 0; background: radial-gradient(transparent 40%, rgba(255,255,255,0.35)); display: none; }
      #stun.on { display: block; }
      #dmg { position: absolute; inset: 0; background: radial-gradient(transparent 50%, rgba(255,40,40,0.55)); opacity: 0; transition: opacity .15s; }
      #bottomleft { position: absolute; left: 14px; bottom: 14px; width: 220px; }
      #hpText { font-weight: 900; font-size: 22px; text-shadow: 0 2px 6px #000; }
      #hp, #armor { height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; margin-top: 4px; }
      #hp i { display: block; height: 100%; background: #ff3b3b; width: 100%; transition: width .15s; }
      #armor { height: 6px; } #armor i { display: block; height: 100%; background: #4d7cff; width: 0; transition: width .15s; }
      #buffs { margin-top: 6px; font-size: 18px; }
      #bottomright { position: absolute; right: 14px; bottom: 14px; text-align: right; }
      #tool span { display: inline-block; padding: 4px 10px; margin-left: 6px; border-radius: 8px; background: rgba(10,8,20,0.7); font-weight: 700; font-size: 13px; opacity: 0.55; }
      #tool span.on { opacity: 1; outline: 2px solid #fff; }
      #power { margin-top: 8px; font-weight: 800; font-size: 14px; color: #b967ff; text-shadow: 0 2px 6px #000; }
      .chip.dead { opacity: 0.45; text-decoration: line-through; }
      #feed { position: absolute; top: 60px; right: 10px; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
      .kill { font-size: 14px; font-weight: 700; background: rgba(10,8,20,0.75); padding: 4px 10px; border-radius: 8px; animation: fadeout 6s forwards; }
      @keyframes fadeout { 0%,70% { opacity: 1 } 100% { opacity: 0 } }
      #lobby { margin-top: 10px; }
      #lobbyName { padding: 9px 12px; border-radius: 8px; border: 1px solid #334155; background: rgba(10,8,20,0.8); color: #fff; width: 180px; font-size: 16px; margin-right: 8px; }
      #ready { margin-top: 0; vertical-align: middle; }
      #ready.on { background: #b4ff39; color: #07060d; box-shadow: 0 0 16px #b4ff39; }
      #lobbyList { list-style: none; padding: 0; margin: 16px auto 0; width: 280px; text-align: left; }
      #lobbyList li { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-radius: 8px; background: rgba(10,8,20,0.6); margin-bottom: 4px; font-weight: 700; }
      #lobbyList li i { width: 12px; height: 12px; border-radius: 50%; }
      #lobbyList li b { margin-left: auto; font-size: 12px; color: #94a3b8; }
      #lobbyList li.ok b { color: #b4ff39; }
      #lobbyHint { font-size: 13px; color: #94a3b8; }
      #toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -80px); font-size: 28px; font-weight: 900; opacity: 0; transition: opacity .2s; text-shadow: 0 2px 10px #000; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="top">
        <h1>🌃 GRAFFITI <span>DE MADRUGADA</span></h1>
        <span id="timer">--</span>
      </div>
      <div id="board"></div>
      <input id="name" maxlength="12" placeholder="Seu nome" aria-label="Seu nome" />
      <div id="cross"></div>
      <div id="push"><i></i></div>
      <div id="dmg"></div>
      <div id="bottomleft">
        <div id="hpText">100</div>
        <div id="hp"><i></i></div>
        <div id="armor"><i></i></div>
        <div id="buffs"></div>
      </div>
      <div id="bottomright">
        <div id="tool"></div>
        <div id="power"></div>
      </div>
      <div id="hint"><kbd>WASD</kbd> andar · <kbd>Mouse</kbd> olhar · <kbd>Espaço</kbd> pular / segurar na parede = escalar · <kbd>Clique</kbd> usar · <kbd>1</kbd>/<kbd>2</kbd> spray/arma · <kbd>F</kbd> soco · <kbd>Q</kbd> poder</div>
      <div id="stun"></div>
      <div id="toast"></div>
      <div id="feed"></div>
      <div id="overlay">
        <div>
          <h2 id="ovTitle">Conectando…</h2>
          <p id="ovText"></p>
          <div id="lobby" style="display:none">
            <input id="lobbyName" maxlength="12" placeholder="Seu nome" aria-label="Seu nome" />
            <button id="ready">Pronto!</button>
            <ul id="lobbyList"></ul>
            <p id="lobbyHint"></p>
          </div>
          <button id="restart" style="display:none">Voltar ao lobby</button>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/shared/city.js"></script>
    <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.js" } }</script>
    <script type="module" src="/game.js"></script>
  </body>
</html>
