<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Graffiti de Madrugada</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07060d; color: #e2e8f0; }
      main { width: min(96vw, 840px); display: grid; gap: 10px; padding: 10px 0; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
      h1 { margin: 0; font-size: 22px; letter-spacing: 1px; }
      h1 span { color: #ff2d75; text-shadow: 0 0 12px #ff2d75; }
      input { padding: 8px 10px; border-radius: 8px; border: 1px solid #334155; background: #111827; color: #fff; width: 140px; }
      #hud { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; min-height: 34px; }
      .chip { display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 999px; background: #111827; border: 2px solid transparent; font-size: 14px; font-weight: 700; }
      .chip.me { border-color: #fff; }
      .chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
      #timer { margin-left: auto; font-size: 26px; font-weight: 900; font-variant-numeric: tabular-nums; }
      #wrap { position: relative; width: 100%; aspect-ratio: 40 / 24; }
      canvas { width: 100%; height: 100%; display: block; border-radius: 10px; border: 3px solid #2a2233; background: #1a1420; }
      #overlay { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(2, 6, 23, 0.65); border-radius: 10px; }
      #overlay.hidden { display: none; }
      #overlay h2 { margin: 0 0 8px; font-size: 34px; }
      #overlay p { margin: 4px 0; color: #cbd5e1; }
      #overlay .big { font-size: 72px; font-weight: 900; line-height: 1; }
      button { margin-top: 12px; padding: 10px 20px; font-size: 16px; font-weight: 800; border: 0; border-radius: 10px; background: #ff2d75; color: #fff; box-shadow: 0 0 16px #ff2d75; cursor: pointer; }
      #help { font-size: 13px; color: #94a3b8; display: flex; gap: 16px; flex-wrap: wrap; }
      kbd { background: #1e293b; padding: 2px 6px; border-radius: 4px; font-family: inherit; }
      #touch { display: none; grid-template-columns: repeat(3, 56px); gap: 6px; justify-content: center; margin-top: 4px; }
      #touch button { margin: 0; padding: 0; width: 56px; height: 56px; font-size: 22px; background: #1e293b; color: #fff; }
      #touch .dash { background: #f43f5e; grid-column: 3; grid-row: 1 / span 3; height: 100%; }
      @media (pointer: coarse) { #touch { display: grid; } #help { display: none; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>🌃 GRAFFITI <span>DE MADRUGADA</span></h1>
        <input id="name" maxlength="12" placeholder="Seu nome" aria-label="Seu nome" />
      </header>
      <div id="hud"><span id="timer">--</span></div>
      <div id="wrap">
        <canvas id="c" width="800" height="480"></canvas>
        <div id="overlay">
          <div>
            <h2 id="ovTitle">Conectando…</h2>
            <p id="ovText"></p>
            <button id="restart" style="display:none">Outra noite</button>
          </div>
        </div>
      </div>
      <div id="help">
        <span><kbd>WASD</kbd> / <kbd>←↑↓→</kbd> andar e pichar o muro</span>
        <span><kbd>Espaço</kbd> empurrão: rival derruba a lata e fica parado</span>
        <span>Quando o sol nascer (90s), maior área pichada vence.</span>
      </div>
      <div id="touch">
        <span></span><button data-k="up">▲</button><button class="dash" data-k="dash">EMPURRA</button>
        <button data-k="left">◀</button><span></span><button data-k="right">▶</button>
        <span></span><button data-k="down">▼</button>
      </div>
    </main>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();
      const canvas = document.getElementById('c');
      const ctx = canvas.getContext('2d');
      const hud = document.getElementById('hud');
      const timerEl = document.getElementById('timer');
      const overlay = document.getElementById('overlay');
      const ovTitle = document.getElementById('ovTitle');
      const ovText = document.getElementById('ovText');
      const restartBtn = document.getElementById('restart');
      const nameInput = document.getElementById('name');

      let me = null;
      let cfg = { gridW: 40, gridH: 24, tile: 20, minPlayers: 2 };
      let state = { phase: 'lobby', players: [], grid: null, timeLeft: 0, winner: null };
      let gridBytes = null;
      const hits = [];
      const prevPos = new Map();

      socket.on('welcome', (w) => { me = w.id; cfg = w; });
      socket.on('full', () => { ovTitle.textContent = 'Muro lotado'; ovText.textContent = 'Máximo de 12 pichadores.'; });
      socket.on('disconnect', () => { overlay.classList.remove('hidden'); ovTitle.textContent = 'Desconectado'; ovText.textContent = 'Recarregue a página.'; });
      socket.on('hit', (h) => hits.push({ ...h, t: performance.now() }));
      socket.on('state', (s) => {
        state = s;
        const bin = atob(s.grid);
        if (!gridBytes || gridBytes.length !== bin.length) gridBytes = new Int8Array(bin.length);
        for (let i = 0; i < bin.length; i++) gridBytes[i] = (bin.charCodeAt(i) << 24) >> 24;
        updateHud();
      });

      function updateHud() {
        const sorted = [...state.players].sort((a, b) => b.score - a.score);
        hud.querySelectorAll('.chip').forEach((e) => e.remove());
        for (const p of sorted) {
          const el = document.createElement('span');
          el.className = 'chip' + (p.id === me ? ' me' : '');
          el.innerHTML = `<i style="background:${p.color}"></i>${esc(p.name)} <b>${p.score}</b>`;
          timerEl.before(el);
        }
        timerEl.textContent = state.phase === 'playing' ? '🌙 ' + fmt(state.timeLeft) : state.phase === 'countdown' ? 'Chacoalha a lata' : '--';

        if (state.phase === 'lobby') {
          overlay.classList.remove('hidden');
          ovTitle.textContent = 'Esperando a crew';
          ovText.textContent = `${state.players.length}/${cfg.minPlayers} na rua — compartilhe o link. A noite começa sozinha.`;
          restartBtn.style.display = 'none';
        } else if (state.phase === 'countdown') {
          overlay.classList.remove('hidden');
          ovTitle.innerHTML = `<span class="big">${state.timeLeft}</span>`;
          ovText.textContent = 'Piche o máximo de muro antes do sol nascer!';
          restartBtn.style.display = 'none';
        } else if (state.phase === 'ended') {
          overlay.classList.remove('hidden');
          const w = state.winner;
          ovTitle.innerHTML = w && w.name !== 'Empate' ? `🏆 <span style="color:${w.color}">${esc(w.name)}</span> dominou o muro!` : '🤝 Empate!';
          ovText.textContent = w ? `${w.score} pedaços de muro pichados` : '';
          restartBtn.style.display = 'inline-block';
        } else {
          overlay.classList.add('hidden');
        }
      }

      function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
      function esc(t) { return t.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]); }

      // ---------- Render ----------
      let wallCache = null;
      function drawWall(T) {
        if (!wallCache) {
          wallCache = document.createElement('canvas');
          wallCache.width = canvas.width; wallCache.height = canvas.height;
          const w = wallCache.getContext('2d');
          w.fillStyle = '#2b1f2a'; w.fillRect(0, 0, canvas.width, canvas.height);
          const bh = T, bw = T * 2;
          for (let row = 0; row * bh < canvas.height; row++) {
            const off = row % 2 ? bw / 2 : 0;
            for (let x = -bw; x < canvas.width; x += bw) {
              const shade = 38 + ((row * 7 + x / bw) % 5) * 4;
              w.fillStyle = `rgb(${shade + 20},${shade},${shade + 8})`;
              w.fillRect(x + off + 1, row * bh + 1, bw - 2, bh - 2);
            }
          }
          const g = w.createRadialGradient(canvas.width * 0.5, 0, 20, canvas.width * 0.5, 0, canvas.height);
          g.addColorStop(0, 'rgba(255,220,150,0.18)'); g.addColorStop(1, 'rgba(0,0,0,0.45)');
          w.fillStyle = g; w.fillRect(0, 0, canvas.width, canvas.height);
        }
        ctx.drawImage(wallCache, 0, 0);
      }
      const colorBySlot = () => { const m = {}; for (const p of state.players) m[p.slot] = p.color; return m; };
      function draw(now) {
        const T = cfg.tile;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const cols = colorBySlot();
        drawWall(T);
        if (gridBytes) {
          for (let i = 0; i < gridBytes.length; i++) {
            const o = gridBytes[i];
            if (o < 0 || !cols[o]) continue;
            const x = (i % cfg.gridW) * T + T / 2;
            const y = Math.floor(i / cfg.gridW) * T + T / 2;
            ctx.fillStyle = cols[o];
            ctx.globalAlpha = 0.85;
            ctx.beginPath();
            ctx.arc(x, y, T * 0.62, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        // interpolate positions a bit for smoothness
        for (const p of state.players) {
          const prev = prevPos.get(p.id) || { x: p.x, y: p.y };
          const x = prev.x + (p.x - prev.x) * 0.5;
          const y = prev.y + (p.y - prev.y) * 0.5;
          prevPos.set(p.id, { x, y });

          if (p.dashing) {
            ctx.beginPath();
            ctx.arc(x, y, 18, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = 0.35;
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          ctx.beginPath();
          ctx.arc(x, y, 10, 0, Math.PI * 2);
          ctx.fillStyle = p.stunned ? '#64748b' : p.color;
          ctx.fill();
          ctx.lineWidth = p.id === me ? 3 : 1.5;
          ctx.strokeStyle = p.id === me ? '#fff' : '#0b1020';
          ctx.stroke();
          if (p.stunned) {
            ctx.fillStyle = '#fde047';
            ctx.font = 'bold 14px system-ui';
            ctx.textAlign = 'center';
            ctx.fillText('💫', x, y - 18 + Math.sin(now / 80) * 2);
          }
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 11px system-ui';
          ctx.textAlign = 'center';
          ctx.fillText(p.name, x, y + 24);
          if (p.id === me && p.dashReadyIn > 0) {
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            ctx.fillRect(x - 12, y - 18, 24, 3);
            ctx.fillStyle = '#fff';
            ctx.fillRect(x - 12, y - 18, 24 * (1 - p.dashReadyIn / 1500), 3);
          }
        }

        // hit flashes
        for (let i = hits.length - 1; i >= 0; i--) {
          const h = hits[i];
          const age = (now - h.t) / 300;
          if (age > 1) { hits.splice(i, 1); continue; }
          ctx.beginPath();
          ctx.arc(h.x, h.y, 12 + age * 30, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,255,255,${1 - age})`;
          ctx.lineWidth = 3;
          ctx.stroke();
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);

      // ---------- Input ----------
      const keys = new Set();
      const map = { ArrowUp: 'up', w: 'up', ArrowDown: 'down', s: 'down', ArrowLeft: 'left', a: 'left', ArrowRight: 'right', d: 'right', ' ': 'dash' };
      let last = '';
      function sendInput() {
        const dx = (keys.has('right') ? 1 : 0) - (keys.has('left') ? 1 : 0);
        const dy = (keys.has('down') ? 1 : 0) - (keys.has('up') ? 1 : 0);
        const k = `${dx},${dy}`;
        if (k !== last) { last = k; socket.emit('input', { dx, dy }); }
      }
      addEventListener('keydown', (e) => {
        if (e.target === nameInput) return;
        const k = map[e.key] ?? map[e.key.toLowerCase()];
        if (!k) return;
        e.preventDefault();
        if (k === 'dash') { if (!e.repeat) socket.emit('dash'); return; }
        keys.add(k); sendInput();
      });
      addEventListener('keyup', (e) => {
        const k = map[e.key] ?? map[e.key.toLowerCase()];
        if (!k || k === 'dash') return;
        keys.delete(k); sendInput();
      });
      addEventListener('blur', () => { keys.clear(); sendInput(); });

      document.querySelectorAll('#touch button').forEach((b) => {
        const k = b.dataset.k;
        const on = (e) => { e.preventDefault(); if (k === 'dash') socket.emit('dash'); else { keys.add(k); sendInput(); } };
        const off = (e) => { e.preventDefault(); keys.delete(k); sendInput(); };
        b.addEventListener('pointerdown', on);
        b.addEventListener('pointerup', off);
        b.addEventListener('pointercancel', off);
        b.addEventListener('pointerleave', off);
      });

      restartBtn.addEventListener('click', () => socket.emit('restart'));
      nameInput.addEventListener('change', () => socket.emit('rename', nameInput.value));
      nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') nameInput.blur(); });
    </script>
  </body>
</html>
