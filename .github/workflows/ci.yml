name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  e2e:
    name: End-to-end (headless Chrome)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:client
      - name: Locate Chrome
        run: echo "CHROME_PATH=$(which google-chrome || which chromium-browser || which chromium)" >> "$GITHUB_ENV"
      - run: pnpm test:e2e

  stack:
    name: Bring the stack up (docker compose + tunnel)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up --build
        run: docker compose up --build -d
      - name: Wait for the game to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q game)")
            echo "game: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker compose logs game
          exit 1
      - name: Smoke test the running stack
        run: |
          docker compose exec -T game node -e "fetch('http://localhost:8080/health').then(r => r.json()).then(j => { console.log(j); if (!j.ok) process.exit(1); })"
          docker compose exec -T game node -e "fetch('http://localhost:8080/').then(r => r.text()).then(t => process.exit(t.includes('Graffiti') ? 0 : 1))"
      - name: Wait for the public tunnel URL
        run: |
          for i in $(seq 1 45); do
            url=$(docker compose logs tunnel 2>/dev/null | grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' | head -n 1 || true)
            if [ -n "$url" ]; then
              echo "URL PÚBLICA: $url"
              echo "### 🌃 Stack no ar" >> "$GITHUB_STEP_SUMMARY"
              echo "URL pública temporária gerada pelo túnel: $url" >> "$GITHUB_STEP_SUMMARY"
              curl -sf --max-time 20 "$url/health" && exit 0
              echo "túnel ainda não responde, tentando de novo..."
            fi
            sleep 2
          done
          docker compose logs tunnel
          exit 1
      - name: Tear down
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy to Render (free)
    runs-on: ubuntu-latest
    needs: [e2e, stack]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency: deploy-production
    environment:
      name: production
      url: ${{ vars.RENDER_URL || 'https://graffitidemadrugada.samuelramos.dev' }}
    env:
      RENDER_URL: ${{ vars.RENDER_URL || 'https://graffitidemadrugada.samuelramos.dev' }}
    steps:
      - name: Skip when RENDER_DEPLOY_HOOK is not configured
        id: hook
        run: echo "present=${{ secrets.RENDER_DEPLOY_HOOK != '' }}" >> "$GITHUB_OUTPUT"
      - name: Trigger deploy hook
        if: steps.hook.outputs.present == 'true'
        run: curl -sf -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
      - name: Wait for the new build to answer /health
        if: steps.hook.outputs.present == 'true'
        run: |
          sleep 60
          for i in $(seq 1 40); do
            if curl -sf --max-time 15 "$RENDER_URL/health"; then
              echo "### 🌃 No ar: $RENDER_URL" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 15
          done
          exit 1
      - name: No hook
        if: steps.hook.outputs.present != 'true'
        run: echo "RENDER_DEPLOY_HOOK ausente — deploy pulado. Veja README › Deploy." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Tag + release
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v${version}-r${{ github.run_number }}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" --generate-notes --title "$tag" \
            --notes "Publicado em ${{ vars.RENDER_URL || 'https://graffitidemadrugada.samuelramos.dev' }} a partir de ${{ github.sha }}."
          echo "### Release $tag" >> "$GITHUB_STEP_SUMMARY"
